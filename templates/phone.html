<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c2a6b">
<title>{{ meta.title }}</title>
{% include '_meta.html' %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Figtree:wght@400;600;800&display=swap">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
/* Phone: one paper card on the cobalt ground; VIP controls pinned beneath it */
body{font-size:16px;padding:env(safe-area-inset-top,0px) 16px calc(env(safe-area-inset-bottom,0px) + 32px)}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding-block:14px 4px}
.top .brand{font-size:1.6rem}
.top .meta{color:var(--muted);font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;text-align:right}
.card{background:var(--paper);color:var(--ink);border-radius:22px;padding:20px 18px 22px;display:flex;flex-direction:column;gap:14px}
.card .label{color:var(--ink-soft)}
.card .sub{color:var(--ink-soft)}
.card .pos{color:var(--ink-gold);font-size:1.2rem}
.card h2{font-size:1.9rem}
.card .headword{font-size:2.5rem}
.card .ghost{color:var(--ink-soft);border-color:#d9d7cb}
.card .person{color:var(--ink);border-color:#d9d7cb}
.card .person.done{background:var(--paper-2)}
.card .person.waiting{border-color:var(--ink-gold);color:var(--ink-gold)}
.card .score{background:var(--paper-2)}
.card .score .rk,.card .def .tag{color:var(--ink-soft)}
.card .score .gain{color:var(--ink-gold)}
.card .score.lead{box-shadow:inset 0 0 0 2px var(--ink-gold)}
.card .def{background:#fff;border:1.5px solid #e2e0d4;font-size:.95rem}
.card .def.hidden{background:transparent;color:#9a9db3;border-style:dashed}
.big{font-size:1.1rem;padding:15px 22px;width:100%}
.opt{width:100%;text-align:left;background:#fff;color:var(--ink);border:1.5px solid #dcdacd;font-family:var(--f-def);font-weight:400;font-size:1.08rem;line-height:1.4;display:grid;grid-template-columns:1.8rem 1fr;gap:8px}
.opt .n{font-family:var(--f-display);color:var(--ink-soft)}
.opt:hover{border-color:var(--ink-gold)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg button{text-align:left;background:#fff;color:var(--ink);border:1.5px solid #dcdacd;display:flex;flex-direction:column;gap:2px;font-weight:600;padding:10px 12px}
.seg button small{color:var(--ink-soft);font-weight:400;font-size:.82rem;line-height:1.3}
.seg button[aria-pressed="true"]{border-color:var(--ink-gold);box-shadow:inset 0 0 0 1px var(--ink-gold)}
.vip{border:1.5px solid var(--accent);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.vip .label{color:var(--accent)}
.vip .ghost{color:#fff}
.vip button{width:100%}
.toast{background:var(--danger);color:#2b0700;font-weight:700;border-radius:12px;padding:10px 14px;overflow-wrap:anywhere}
.toast.ok{background:var(--real);color:var(--real-ink)}
.count{font-size:.8rem;color:var(--ink-soft);text-align:right;font-variant-numeric:tabular-nums}
.quiet{color:var(--muted);font-size:.85rem;text-align:center}
.quiet button{background:none;border:0;color:var(--muted);text-decoration:underline;padding:4px;font-weight:600}
.code-in{font-size:1.6rem;letter-spacing:.35em;text-transform:uppercase;text-align:center}
.locked{font-family:var(--f-def);font-size:1.1rem;background:#fff;border:1.5px solid #e2e0d4;border-radius:12px;padding:12px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><div class="brand">Fiction<span>ary</span></div><div class="meta" id="meta"></div></header>
  <div id="toast"></div>
  <section class="card pop" id="main"></section>
  <section id="status" class="stack"></section>
  <section id="vip"></section>
  <p class="quiet" id="foot"></p>
</div>
<script src="{{ url_for('static', filename='socket.io.min.js') }}"></script>
<script src="{{ url_for('static', filename='common.js') }}"></script>
<script src="{{ url_for('static', filename='phone.js') }}"></script>
</body>
</html>
