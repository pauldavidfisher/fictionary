{# Link previews (Facebook, Messenger, WhatsApp, iMessage, X, LinkedIn, Slack, Discord, Pinterest), icons and search info #}
<meta name="description" content="{{ meta.description }}">
<link rel="canonical" href="{{ meta.url }}">
<meta name="application-name" content="Fictionary">
<meta name="apple-mobile-web-app-title" content="Fictionary">
<meta name="theme-color" content="#1c2a6b">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Fictionary Party">
<meta property="og:locale" content="en_US">
<meta property="og:title" content="{{ meta.title }}">
<meta property="og:description" content="{{ meta.description }}">
<meta property="og:url" content="{{ meta.url }}">
<meta property="og:image" content="{{ meta.base }}/static/img/share.jpg">
<meta property="og:image:secure_url" content="{{ meta.base }}/static/img/share.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Fictionary: the bluffing dictionary game. The word gongoozler with three definitions, one of them real.">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ meta.title }}">
<meta name="twitter:description" content="{{ meta.description }}">
<meta name="twitter:image" content="{{ meta.base }}/static/img/share.jpg">
<meta name="twitter:image:alt" content="Fictionary: the bluffing dictionary game. The word gongoozler with three definitions, one of them real.">

<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='img/favicon-32.png') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}">
<link rel="manifest" href="/manifest.webmanifest">

<script type="application/ld+json">{{ meta.jsonld | tojson }}</script>
